name: Codzienne liturgie Traditiones — bez płatnego API
on:
  schedule:
    - cron: '17 4 * * *'
      timezone: 'Europe/Warsaw'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: traditiones-liturgie-pages
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Zależności
        run: pip install -r requirements.txt
      - name: Testy
        run: python test_local.py
      - name: Wygeneruj dziś i trzy kolejne dni (bez API)
        run: python generate_daily.py --days 4 --replace
      - name: Przygotuj GitHub Pages
        uses: actions/configure-pages@v5
      - name: Opublikuj treści
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Udostępnij stronę
        id: deployment
        uses: actions/deploy-pages@v4
